[project]
name = "pycon-cal-scraper"
version = "0.1.0"
description = "Scrape the PyCon US 2026 schedule, search it interactively, and sync selected events to Google Calendar."
readme = "README.md"
authors = [
    { name = "Matthew Billman", email = "mgbvox@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "typer>=0.12",
    "prompt-toolkit>=3.0",
    "platformdirs>=4.2",
    "python-dateutil>=2.9",
    "rich>=13.7",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
    "voyageai>=0.3",
    "numpy>=2.0",
]

[project.scripts]
pycon-cal-scraper = "pycon_cal_scraper.cli:app"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.5",
    "ty>=0.0.1a1",
    "types-beautifulsoup4>=4.12",
    "types-python-dateutil>=2.9",
    "freezegun>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=pycon_cal_scraper --cov-report=term-missing --cov-fail-under=80 -ra"
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
]

[tool.coverage.run]
branch = true
source = ["pycon_cal_scraper"]
